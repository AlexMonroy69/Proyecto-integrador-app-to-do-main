server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mi_base_de_datos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:Jose_Java}
    password: ${DB_PASSWORD:Jose_JMN0306}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    # Origenes del frontend permitidos, separados por coma
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
  jwt:
    # Cambiar en produccion (minimo 32 caracteres)
    secret: ${JWT_SECRET:cambia-esta-clave-secreta-en-produccion-0123456789}
    access-ttl-seconds: 3600
    refresh-ttl-hours: 24
  admin:
    # Primer usuario ADMIN, se crea al arrancar si no existe ningun ADMIN
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin12345}
